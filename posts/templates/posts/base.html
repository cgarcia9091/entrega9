
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Blog{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}">
</head>
<body>

    <header>
        <nav class="menu-navegacion">
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'lista_posts' %}">Posts</a>
            <a href="{% url 'acerca' %}">Nosotros</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Mi Blog - Todos los derechos reservados</p>
    </footer>

</body>
</html>
